# MD1000 / RK3566 的 ALSA 预设路由 —— 送到 HDMI。
#
# ★一律按【卡名】定址,不要写卡号★
# 这块板子两张 simple-card 的探测顺序不固定,0/1 会在两次开机之间对调:
#     某次开机: 0 [RK809]  1 [HDMI]      另一次: 0 [HDMI]  1 [RK809]
# 所以 hw:1,0 这种写死编号必然周期性失灵(声音被送去类比卡=没声音)。
# 与 UUID vs LABEL 是同一类错误:凡是会漂移的东西都不要写死。
#
# dmix 的 rate 用 48000:对齐 HDMI 原生率与 RetroArch 的 audio_out_rate,
# 少一层重采样。(改这个值之后必须重启 ES —— ES 是 dmix 的第一个开启者,
# 旧参数锁在它手上,不重启不会以新率重建。)
#
# ★已知问题(未解)★:纯 ALSA + 自建 dmix 会偶发整条链哑掉 —— 某个客户端
# (实例:apple2)结束后连持有 dmix 的 ES 自己都没声,得靠外部再播一次才救得回来,
# 重开机又回到哑的。曾尝试改走 PulseAudio 取代 dmix,但 RA/PPSSPP 连不上 pulse
# (RA 报 "[PulseAudio] Connection failed"),比现状更糟,已完整回退。
# 详见 memory: md1000_emuelec_av_audio。
#
# 注意:EmuELEC 的 setauddev() 每次开机都会把 ee_audio_device 的值
# 用 sed 填进下面 dmix slave 的 pcm "hw:..." 那一行。所以别自己改档跟它
# 对抗,要把 ee_audio_device 设成 CARD=HDMI,DEV=0 顺着它走
# (见 md1000-audio-setup.sh)。

pcm.!default {
    type plug
    slave.pcm "softvol"
}

pcm.softvol {
    type softvol
    slave {
        pcm "dmixer"
    }
    control {
        name "Master"
        card HDMI
    }
    min_dB -50.0
    max_dB 0.0
}

pcm.dmixer {
    type dmix
    ipc_key 1024
    slave {
        pcm "hw:CARD=HDMI,DEV=0"
        period_time 0
        period_size 1024
        buffer_size 4096
        rate 48000
    }
    bindings {
        0 0
        1 1
    }
}

ctl.!default {
    type hw
    card HDMI
}
