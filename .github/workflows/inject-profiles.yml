#==========================================================================
# Lane P (profiles): bake es4all-profiles into an already-built EmuELEC image
# as a first-boot baseline. Nothing is recompiled: download the release image,
# unsquash SYSTEM, drop the payload into /usr/config, re-squash (~5 min).
#
# Design doc (single source of truth, do NOT restate it here):
#   https://github.com/w2xg2022/es4all-profiles/blob/main/docs/firmware-injection.md
#
# Deliberately a separate workflow, not a step of build-emuelec.yml: re-running
# the injection is the thing you do most often (every profile change), and
# folding it into the build would make that mean "rebuild everything".
#==========================================================================

name: Inject es4all-profiles into image

on:
  workflow_dispatch:
    inputs:
      RELEASE_TAG:
        description: "release tag holding the built image (e.g. MD1000-30780359125)"
        required: true
        type: string
      PROFILES_REF:
        description: "es4all-profiles ref to bake in (branch, tag or SHA)"
        default: "main"
        type: string

jobs:
  inject-profiles:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install host tools
        run: sudo apt-get update && sudo apt-get install -y squashfs-tools

      - name: Fetch es4all-profiles
        id: profiles
        run: |
          set -euo pipefail
          git clone https://github.com/${{ github.repository_owner }}/es4all-profiles.git profiles
          cd profiles
          git checkout -q "${{ inputs.PROFILES_REF }}"
          SHA=$(git rev-parse HEAD)
          VER=$(sed -n 's/.*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' manifest.json | head -1)
          echo "sha=$SHA"     >> "$GITHUB_OUTPUT"
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      # The single most valuable check here. A payload whose manifest does not
      # match its files is worse than no payload: the device verifies md5 per
      # file and aborts the WHOLE batch, so one stale entry silently disables
      # every profile. This has actually happened (profiles pushed, devices
      # "saw no update" -- the manifest had not been regenerated).
      - name: Verify manifest matches the files
        run: |
          set -euo pipefail
          cd profiles
          cp manifest.json /tmp/manifest.committed.json
          sh tools/gen_manifest.sh >/dev/null
          # Compare the payload only -- NOT the whole file.
          # gen_manifest.sh bumps "version" (YYYY.MM.DD.N) on every run, so a plain
          # `git diff --quiet manifest.json` can never come back clean: it would fail
          # on a perfectly healthy repo, every single time. It did exactly that on its
          # first real run. What matters is whether the file list and the md5s still
          # describe the files that are actually there.
          python3 -c "import json,sys; a=json.load(open('manifest.json',encoding='utf-8')); b=json.load(open('/tmp/manifest.committed.json',encoding='utf-8')); fa={x['path']:x.get('md5') for x in a.get('files',[])}; fb={x['path']:x.get('md5') for x in b.get('files',[])}; d=[p for p in sorted(set(fa)|set(fb)) if fa.get(p)!=fb.get(p)]; print('::error::manifest.json is stale -- run tools/gen_manifest.sh in es4all-profiles and push') if d else None; [print('  %s: committed=%s actual=%s' % (p, fb.get(p), fa.get(p))) for p in d[:40]]; sys.exit(1 if d else 0); " || exit 1
          echo "manifest OK"

      - name: Download the built image
        run: |
          set -euo pipefail
          gh release download "${{ inputs.RELEASE_TAG }}" -R "${{ github.repository }}" -p '*.img.gz' -D img
          ls -la img/
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Inject payload into SYSTEM
        run: |
          set -euo pipefail
          SRC=$(ls img/*.img.gz | head -1)
          gzip -dc "$SRC" > base.img
          LOOP=$(sudo losetup --find --show --partscan base.img)
          sudo mkdir -p /mnt/flash
          # EmuELEC keeps SYSTEM on the first (FAT) partition, same as ROCKNIX.
          sudo mount "${LOOP}p1" /mnt/flash
          sudo unsquashfs -d SYSTEM.d /mnt/flash/SYSTEM

          DEST=SYSTEM.d/usr/config/es4all-profiles
          sudo rm -rf "$DEST"; sudo mkdir -p "$DEST"
          # tar, not cp -r: keeps the executable bit on bin/*, without which the
          # scripts simply do not run (and nothing says why).
          (cd profiles && tar --exclude-vcs -cf - .) | sudo tar -C "$DEST" -xf -
          echo "${{ steps.profiles.outputs.version }}" | sudo tee SYSTEM.d/usr/config/es4all-profiles.version >/dev/null
          echo "${{ steps.profiles.outputs.sha }}"     | sudo tee SYSTEM.d/usr/config/es4all-profiles.sha >/dev/null

          # Prove it landed -- a cp to the wrong path looks exactly like success.
          {
            echo "### injected profiles"
            echo "- ref: \`${{ inputs.PROFILES_REF }}\` -> \`${{ steps.profiles.outputs.sha }}\`"
            echo "- manifest version: \`${{ steps.profiles.outputs.version }}\`"
            echo "- files: \`$(sudo find "$DEST" -type f | wc -l)\`"
            echo "- executables under bin/: \`$(sudo find "$DEST" -path '*/bin/*' -perm -u+x -type f | wc -l)\`"
          } >> "$GITHUB_STEP_SUMMARY"

          sudo mksquashfs SYSTEM.d SYSTEM.new -noappend -comp zstd -Xcompression-level 19 -b 1M
          sudo cp SYSTEM.new /mnt/flash/SYSTEM
          sync

          # Zero the free space before re-compressing.
          #
          # Replacing SYSTEM leaves the OLD file's blocks sitting in the partition's
          # free space as garbage. The image itself is no bigger -- in fact the new
          # SYSTEM is smaller -- but gzip can no longer squash that area, which used
          # to be zeros. Measured on MD1000 (2026-08-05): 698 MB -> 1.29 GB, +85%,
          # for a payload of a few hundred KB. Nothing warns you: the image is
          # perfectly valid, just twice the download.
          #
          # Filling the remainder with zeros and deleting the file restores the
          # compressibility. dd is expected to end with ENOSPC -- that IS the
          # success condition here, hence `|| true`.
          sudo dd if=/dev/zero of=/mnt/flash/ZERO.tmp bs=1M status=none || true
          # sync BEFORE rm -- this is the whole trick.
          # Deleting the file while its pages are still dirty makes the kernel drop
          # them: the zeros never reach the image and the free space stays garbage.
          # Measured (MD1000, 2026-08-05): rm-then-sync 829 MB vs sync-then-rm 698 MB,
          # against a pristine 698 MB. Same commands, one line apart, 19% difference.
          sync
          sudo rm -f /mnt/flash/ZERO.tmp
          sync
          sudo umount /mnt/flash
          sudo losetup -d "$LOOP"
          # Keep the original file name and overwrite the release asset.
          #
          # The first version kept both: the release asset (no payload) and an
          # artifact named *-profiles.img.gz. That is worse, not safer -- whoever
          # lands on the release page downloads the one WITHOUT the payload, i.e.
          # the image whose first boot is silently wrong. One tag, one image.
          #
          # Provenance does not come from the file name (which is now identical
          # either way) but from the release notes, appended below: they record the
          # exact profiles commit and manifest version baked in. A file name cannot
          # carry that anyway -- it could only tell you "injected" or not, never which.
          OUT="$(basename "$SRC")"
          gzip -c base.img > "$OUT"
          sha256sum "$OUT" > "$OUT.sha256"
          echo "OUT=$OUT" >> "$GITHUB_ENV"

      - name: Publish back to the release (replacing the un-injected image)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload "${{ inputs.RELEASE_TAG }}" "${OUT}" "${OUT}.sha256" \
            --repo "${{ github.repository }}" --clobber
          # Record provenance in the notes. Built with printf into a file: an
          # inline multi-line shell string would have to break the YAML block's
          # indentation, and GitHub rejects that even when a local yaml parser
          # accepts it (learned the hard way -- HTTP 422 on dispatch).
          gh release view "${{ inputs.RELEASE_TAG }}" --repo "${{ github.repository }}" --json body --jq .body \
            | grep -v "es4all-profiles baked in" > /tmp/notes.md || true
          printf '\nes4all-profiles baked in: %s (manifest %s)\n' \
            "${{ steps.profiles.outputs.sha }}" "${{ steps.profiles.outputs.version }}" >> /tmp/notes.md
          gh release edit "${{ inputs.RELEASE_TAG }}" --repo "${{ github.repository }}" --notes-file /tmp/notes.md

      - name: Upload artifact as well
        uses: actions/upload-artifact@v4
        with:
          name: image-with-profiles
          path: ${{ env.OUT }}
          retention-days: 7
