name: Build EmuELEC

on:
  workflow_dispatch:
    inputs:
      models:
        description: '要编译的型号列表(空格分隔)，留空则用 repo variable MODELS'
        required: false
        default: ''
  schedule:
    # 每月1号 03:00 UTC 自动全部型号重新编译一次(跟上游同步)
    - cron: '0 3 1 * *'

permissions:
  contents: write

env:
  PROJECT: Amlogic-ce
  DEVICE: Amlogic-no
  ARCH: aarch64
  DISTRO: EmuELEC

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - id: set
        run: |
          MODELS="${{ github.event.inputs.models }}"
          if [ -z "$MODELS" ]; then
            MODELS="${{ vars.MODELS }}"
          fi
          if [ -z "$MODELS" ]; then
            MODELS="X98mini"
          fi
          JSON=$(printf '%s\n' $MODELS | jq -R . | jq -s -c .)
          echo "matrix=$JSON" >> "$GITHUB_OUTPUT"
          echo "Models to build: $MODELS"

  build:
    needs: prepare
    runs-on: ubuntu-22.04
    # NOTE(w2xg2022): GitHub代管runner有硬性6小時(360分鐘)執行上限，timeout-minutes
    # 設更高也沒用，runner基礎設施會強制中止。實測跑到350分鐘進度497/639且過程中
    # 完全沒有錯誤(純粹被逾時砍掉)，代表之前修的所有上游來源/編譯問題都真的解決了，
    # 剩下的是單純"時間不夠"，靠下面新增的ccache跨次建置快取來解，不是硬幹拉長時間。
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        model: ${{ fromJson(needs.prepare.outputs.matrix) }}
    steps:
      - name: Maximize build space
        uses: easimon/maximize-build-space@v10
        with:
          # NOTE(w2xg2022): root-reserve-mb太小(1024)，建置跑超過2小時後根目錄(/tmp、
          # runner自己的診斷log等雜項寫入)會慢慢塞滿，最終連runner本身都掛掉(No space
          # left on device寫進runner自己的trace log)。調大給更多餘裕。
          # 8192仍然不夠(2小時後_diag/Worker_*.log累積太大)，調到16384。
          root-reserve-mb: 16384
          swap-size-mb: 512
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - name: Show disk space
        run: df -h

      - name: Checkout
        uses: actions/checkout@v4

      # NOTE(w2xg2022): 之前用actions/cache存sources/ccache，但GitHub的6小時硬上限
      # 是暴力砍斷整個job，來不及跑cache的儲存(post)步驟，導致快取永遠存不進去，
      # 每次都從零開始編到差不多同一個進度又被砍，等於白做。改用GitHub Release
      # 當作「建置接力狀態」的存放點：把工具鏈+已裝好的套件+進度標記(.stamps)
      # 打包成一個檔案存進Release，不受6小時job生命週期限制，下一輪開工前先
      # 還原回來，讓建置系統(靠.stamps判斷哪些套件已經裝好)自動接著編，不用
      # 重頭來過。真正確保「存檔」這步會執行，Build步驟本身會在時間快到前
      # 自己主動停下來(見下面的timeout設計)，而不是被GitHub暴力砍斷。
      - name: Restore build checkpoint from Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAG="build-state-${{ matrix.model }}"
          if gh release download "${RELEASE_TAG}" -p 'state.tar.zst' -O /tmp/state.tar.zst --repo ${{ github.repository }} 2>/dev/null; then
            echo "找到上一輪的建置接力狀態，先驗證完整性..."
            ls -lh /tmp/state.tar.zst
            # NOTE(w2xg2022): 存檔如果被6小時硬牆砍到一半，上傳的會是殘缺的zstd
            # 串流(premature end)。還原前先用zstd -t驗證，損壞就丟棄從零開始，
            # 絕不能拿半殘的狀態去接續(.stamps會誤判某些套件已裝好，但檔案其實
            # 不完整，導致後面編譯出莫名其妙的錯)。
            if zstd -t /tmp/state.tar.zst 2>/dev/null; then
              echo "完整性OK，還原中..."
              tar -I zstd -xf /tmp/state.tar.zst -C "${{ github.workspace }}"
              echo "還原完成："
              du -sh build.*/toolchain build.*/install_pkg build.*/.stamps 2>/dev/null
            else
              echo "接力狀態檔損壞(上一輪存檔被逾時砍斷)，丟棄，從零開始建置"
              rm -f /tmp/state.tar.zst
              rm -rf build.*/
            fi
          else
            echo "沒有找到之前的接力狀態，從零開始建置"
          fi

      - name: Install build dependencies
        run: |
          # NOTE(w2xg2022): GitHub官方runner映像檔預裝了packages.microsoft.com
          # (azure-cli/microsoft-prod)的apt來源，我們的建置完全用不到Azure CLI，
          # 但這兩個來源偶爾會回403，apt-get update預設對任一來源失敗都回傳
          # 非零結束碼，搭配GitHub Actions的run:預設bash -e，整個step會在這裡
          # 直接中止(實測確認：ubuntu本身的套件列表都正常抓到，只有微軟這兩個
          # 來源出問題)。跟我們自己的原始碼完全無關，建置前先移除這兩個用不到
          # 的來源清單，避免apt-get update被它們拖垮。
          sudo grep -rl 'packages.microsoft.com' /etc/apt/sources.list.d/ 2>/dev/null | xargs -r sudo rm -f
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            gcc make git unzip wget xz-utils libsdl2-dev libsdl2-mixer-dev \
            libfreeimage-dev libfreetype6-dev libcurl4-openssl-dev rapidjson-dev \
            libasound2-dev libgl1-mesa-dev build-essential libboost-all-dev cmake \
            fonts-droid-fallback libvlc-dev libvlccore-dev vlc-bin texinfo premake4 \
            golang libssl-dev curl patchelf xmlstarlet default-jre xsltproc \
            libvpx-dev rdfind tzdata xfonts-utils lzop \
            libparse-yapp-perl gperf libxml-parser-perl patchutils zstd
          sudo apt-get clean

      - name: Build (${{ matrix.model }})
        run: |
          # NOTE(w2xg2022): /tmp掛在根目錄那個小分區(maximize-build-space沒擴充它，
          # 開局就只剩~100MB)，gcc預設把組譯暫存檔(.s等)寫到/tmp，kernel編譯量大時
          # 會把/tmp塞爆導致"No space left on device"，跟GITHUB_WORKSPACE大容量分區
          # 是否還有空間完全無關。改把TMPDIR指到大容量分區下的目錄。
          # root-reserve-mb從1024調到8192後仍在2小時後爆掉(runner自己的_diag log寫不進去)，
          # 懷疑是某些host端工具(pip/npm/go等)預設快取寫進$HOME(也在根目錄小分區)累積出來的，
          # 連HOME一起搬到大容量分區，徹底排除根目錄小分區的依賴。
          mkdir -p "${{ github.workspace }}/.tmp" "${{ github.workspace }}/.home"
          export TMPDIR="${{ github.workspace }}/.tmp"
          export HOME="${{ github.workspace }}/.home"
          (
            PROJECT=${{ env.PROJECT }} DEVICE=${{ env.DEVICE }} SUBDEVICE=${{ matrix.model }} \
            ARCH=${{ env.ARCH }} DISTRO=${{ env.DISTRO }} TMPDIR="${TMPDIR}" HOME="${HOME}" make image
          ) > build-${{ matrix.model }}.log 2>&1 &
          BUILD_PID=$!

          # NOTE(w2xg2022): GitHub的6小時硬上限會暴力砍斷整個job，來不及執行
          # 後面「打包存檔」的步驟。第一版設5小時40分，結果「開場準備(約15分)
          # +建置(5h40m)+存檔上傳(11GB要打包+上傳約20-30分)」加起來超過6小時，
          # 存檔被硬牆砍到一半、上傳出殘缺檔。改成建置只跑5小時整就主動停，
          # 留足足一小時給開場準備+存檔上傳，確保接力狀態能完整存進Release。
          MAX_BUILD_SECONDS=18000
          START_TS=$(date +%s)

          # 背景磁碟監控：可用空間<8GB時，自動清理已完成套件的build/原始編譯目錄
          # (保留install_pkg/成果，已驗證安全，最終映像組裝讀install_pkg不是build/)
          # NOTE(w2xg2022): maximize-build-space把大容量磁碟掛在GITHUB_WORKSPACE(這裡的CWD)，
          # 不是掛在根目錄"/"！根目錄本來就幾乎全滿跟建置無關，之前一直查"/"等於監控完全失效。
          while kill -0 $BUILD_PID 2>/dev/null; do
            sleep 60
            BUILD_DIR=$(ls -d build.*/ 2>/dev/null | head -1)
            AVAIL_GB=$(df --output=avail . | tail -1 | awk '{print int($1/1024/1024)}')
            ELAPSED=$(( $(date +%s) - START_TS ))
            echo "[monitor] $(date +%T) disk avail: ${AVAIL_GB}GB, elapsed: ${ELAPSED}s"
            if [ "$AVAIL_GB" -lt 15 ] && [ -n "$BUILD_DIR" ] && [ -d "${BUILD_DIR}install_pkg" ]; then
              echo "[monitor] disk low, cleaning completed packages' build/ dirs..."
              CLEANED=0
              for d in $(ls "${BUILD_DIR}install_pkg" 2>/dev/null); do
                if [ -d "${BUILD_DIR}build/$d" ]; then
                  rm -rf "${BUILD_DIR}build/$d"
                  CLEANED=$((CLEANED+1))
                fi
              done
              echo "[monitor] cleaned ${CLEANED} package build dirs"
              df -h .
            fi
            if [ "$ELAPSED" -ge "$MAX_BUILD_SECONDS" ]; then
              echo "[monitor] 時間快到6小時上限，主動停止建置以保留接力狀態..."
              kill -TERM $BUILD_PID 2>/dev/null
              sleep 15
              kill -KILL $BUILD_PID 2>/dev/null
              break
            fi
          done

          wait $BUILD_PID
          BUILD_EXIT=$?
          tail -100 build-${{ matrix.model }}.log
          echo "checkpoint_reason=timeout_self_stop_or_finished" >> "$GITHUB_OUTPUT" 2>/dev/null || true
          exit $BUILD_EXIT
        continue-on-error: true
        id: build_step

      - name: Save build checkpoint to Release (always)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BUILD_DIR=$(ls -d build.*/ 2>/dev/null | head -1)
          if [ -z "$BUILD_DIR" ]; then
            echo "找不到建置資料夾，跳過存檔"
            exit 0
          fi
          echo "打包接力狀態(工具鏈+已裝套件+進度標記)..."
          tar -I 'zstd -T0 -3' -cf /tmp/state.tar.zst \
            "${BUILD_DIR}toolchain" "${BUILD_DIR}install_pkg" "${BUILD_DIR}.stamps" 2>&1 | tail -20
          ls -lh /tmp/state.tar.zst
          RELEASE_TAG="build-state-${{ matrix.model }}"
          gh release view "${RELEASE_TAG}" --repo ${{ github.repository }} >/dev/null 2>&1 || \
            gh release create "${RELEASE_TAG}" --repo ${{ github.repository }} \
              --title "建置接力狀態(自動，${{ matrix.model }})" \
              --notes "自動保存的建置中間狀態，供下一輪雲編譯接續使用，不是可安裝的韌體。"
          gh release upload "${RELEASE_TAG}" /tmp/state.tar.zst --repo ${{ github.repository }} --clobber

      - name: Fail job if build did not actually succeed
        if: steps.build_step.outcome != 'success'
        run: |
          echo "本輪建置未完整跑完(逾時自停或真的失敗)，接力狀態已存檔，等下一輪繼續。"
          exit 1

      - name: Collect artifacts
        id: collect
        run: |
          mkdir -p out
          find . -maxdepth 3 -type d -name "target" -exec sh -c 'cp -v "$1"/*.img.gz out/ 2>/dev/null; cp -v "$1"/*.img.xz out/ 2>/dev/null; cp -v "$1"/*.tar out/ 2>/dev/null' _ {} \;
          find . -maxdepth 6 -iname "*${{ env.DISTRO }}*${{ matrix.model }}*" \( -iname "*.img.gz" -o -iname "*.img.xz" -o -iname "*.tar" \) -exec cp -v {} out/ \; 2>/dev/null || true
          ls -la out/ || echo "no artifacts found, check build log"

      - name: Upload build log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.model }}
          path: build-${{ matrix.model }}.log
          retention-days: 14

      - name: Upload firmware artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: EmuELEC-${{ matrix.model }}
          path: out/*
          if-no-files-found: warn

      - name: Create release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ matrix.model }}-${{ github.run_id }}
          name: "EmuELEC ${{ matrix.model }} (${{ github.run_id }})"
          files: out/*
          body: |
            自动云编译：${{ env.PROJECT }}/${{ env.DEVICE }} SUBDEVICE=${{ matrix.model }}
            触发方式：${{ github.event_name }}
