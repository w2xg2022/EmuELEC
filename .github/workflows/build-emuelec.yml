name: Build EmuELEC

on:
  workflow_dispatch:
    inputs:
      models:
        description: '要编译的型号列表(空格分隔)，留空则用 repo variable MODELS'
        required: false
        default: ''
  # NOTE(w2xg2022): 月度cron暂时停用——目前还在适配期(平行编译/接力机制调试中)，
  # 先不让它自动触发以免干扰或浪费云端时数。适配稳定后把下面schedule取消注释即可
  # 重新启用。启用后的逻辑已做好(见prepare的gate步骤)：仅在repo commit相对上次
  # 成功建置有变动时才真的编，没变就整轮skip；有变也靠接力checkpoint+.stamps只重
  # 编改动到的套件，不会每月从零全编。
  # schedule:
  #   # 每月1号 03:00 UTC
  #   - cron: '0 3 1 * *'

permissions:
  contents: write

env:
  PROJECT: Amlogic-ce
  DEVICE: Amlogic-no
  ARCH: aarch64
  DISTRO: EmuELEC

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
      needed: ${{ steps.gate.outputs.needed }}
    steps:
      - id: set
        run: |
          MODELS="${{ github.event.inputs.models }}"
          if [ -z "$MODELS" ]; then
            MODELS="${{ vars.MODELS }}"
          fi
          if [ -z "$MODELS" ]; then
            MODELS="X98mini"
          fi
          JSON=$(printf '%s\n' $MODELS | jq -R . | jq -s -c .)
          echo "matrix=$JSON" >> "$GITHUB_OUTPUT"
          echo "Models to build: $MODELS"
      # NOTE(w2xg2022): 「代碼沒變就不編」閘門。手動觸發(workflow_dispatch)一律建置；
      # 只有排程(schedule)觸發時，才比對現在的commit跟上次成功建置記錄的commit
      # (存在built-commit這個Release的body)。一樣就整輪skip，省掉沒必要的月度重建。
      - id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "手動觸發，一律建置"
            echo "needed=yes" >> "$GITHUB_OUTPUT"; exit 0
          fi
          LAST=$(gh release view built-commit --repo ${{ github.repository }} --json body -q .body 2>/dev/null | tr -d '[:space:]')
          NOW="${{ github.sha }}"
          if [ -n "$LAST" ] && [ "$LAST" = "$NOW" ]; then
            echo "代碼自上次成功建置以來未變($NOW)，跳過本次月度重建"
            echo "needed=no" >> "$GITHUB_OUTPUT"
          else
            echo "代碼有變(上次:${LAST:-無} 現在:$NOW)，執行建置"
            echo "needed=yes" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: prepare
    if: needs.prepare.outputs.needed == 'yes'
    # NOTE(w2xg2022): 用ubuntu-22.04——这是实测能一路建完base到515的已知环境。曾为
    # VM-base seed短暂改24.04(VM host工具需glibc2.39)，但VM-base搬云端不可携(host工具
    # 绑死VM的glibc+CPU)已放弃；且24.04的系统autotools较新会让libtool的autoreconf挂
    # (cannot open libltdl/ltdl.mk)。故回22.04。
    runs-on: ubuntu-22.04
    # NOTE(w2xg2022): GitHub代管runner有硬性6小時(360分鐘)執行上限，timeout-minutes
    # 設更高也沒用，runner基礎設施會強制中止。實測跑到350分鐘進度497/639且過程中
    # 完全沒有錯誤(純粹被逾時砍掉)，代表之前修的所有上游來源/編譯問題都真的解決了，
    # 剩下的是單純"時間不夠"，靠下面新增的ccache跨次建置快取來解，不是硬幹拉長時間。
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        model: ${{ fromJson(needs.prepare.outputs.matrix) }}
    steps:
      - name: Maximize build space
        uses: easimon/maximize-build-space@v10
        with:
          # NOTE(w2xg2022): root-reserve-mb太小(1024)，建置跑超過2小時後根目錄(/tmp、
          # runner自己的診斷log等雜項寫入)會慢慢塞滿，最終連runner本身都掛掉(No space
          # left on device寫進runner自己的trace log)。調大給更多餘裕。
          # 8192仍然不夠(2小時後_diag/Worker_*.log累積太大)，調到16384。
          root-reserve-mb: 16384
          swap-size-mb: 512
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - name: Show disk space
        run: df -h

      - name: Checkout
        uses: actions/checkout@v4

      # NOTE(w2xg2022): 之前用actions/cache存sources/ccache，但GitHub的6小時硬上限
      # 是暴力砍斷整個job，來不及跑cache的儲存(post)步驟，導致快取永遠存不進去，
      # 每次都從零開始編到差不多同一個進度又被砍，等於白做。改用GitHub Release
      # 當作「建置接力狀態」的存放點：把工具鏈+已裝好的套件+進度標記(.stamps)
      # 打包成一個檔案存進Release，不受6小時job生命週期限制，下一輪開工前先
      # 還原回來，讓建置系統(靠.stamps判斷哪些套件已經裝好)自動接著編，不用
      # 重頭來過。真正確保「存檔」這步會執行，Build步驟本身會在時間快到前
      # 自己主動停下來(見下面的timeout設計)，而不是被GitHub暴力砍斷。
      - name: Restore build checkpoint from Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAG="build-state-${{ matrix.model }}"
          # NOTE(w2xg2022): 接力狀態被切成多塊(state.tar.zst.partNN，各<2GiB繞開
          # GitHub單一asset上限)。下載全部分塊到大容量分區(不能放/tmp小分區)，
          # 照順序cat拼回完整檔再驗證。
          STATE_FILE="${{ github.workspace }}/state.tar.zst"
          STATE_DIR="${{ github.workspace }}/_state_parts"
          mkdir -p "${STATE_DIR}"
          if gh release download "${RELEASE_TAG}" -p 'state.tar.zst.part*' -D "${STATE_DIR}" --repo ${{ github.repository }} 2>/dev/null && ls "${STATE_DIR}"/state.tar.zst.part* >/dev/null 2>&1; then
            echo "找到上一輪的接力狀態分塊，拼回中..."
            ls -lh "${STATE_DIR}"/state.tar.zst.part*
            cat "${STATE_DIR}"/state.tar.zst.part* > "${STATE_FILE}"
            rm -rf "${STATE_DIR}"
            ls -lh "${STATE_FILE}"
            # 拼回後先用zstd -t驗證完整性，損壞(存檔曾被砍/分塊缺失)就丟棄從零開始，
            # 絕不能拿半殘的狀態去接續(.stamps會誤判某些套件已裝好但檔案其實不完整)。
            if zstd -t "${STATE_FILE}" 2>/dev/null; then
              echo "完整性OK，還原中..."
              tar -I zstd -xf "${STATE_FILE}" -C "${{ github.workspace }}"
              rm -f "${STATE_FILE}"
              echo "還原完成："
              du -sh build.*/toolchain build.*/install_pkg build.*/.stamps 2>/dev/null
              # NOTE(w2xg2022): glibc/icu在「安裝階段」會回頭引用自己的build目錄
              # (glibc: emuelec-emulationstation取charmaps/localedef; icu: --with-cross-build
              # 要host build目錄)。checkpoint為省空間剝掉了build/，若還原的舊checkpoint
              # 沒帶這兩個的build目錄，就清掉它們的.stamps強制重編一次(重編會重新產生
              # build目錄)。之後的存檔會保留這兩個build目錄(見save步驟)，所以只有第一次
              # 用舊checkpoint時會重編。
              BD=$(ls -d build.*/ 2>/dev/null | head -1)
              # NOTE(w2xg2022): 这些套件的build目录会在「安装阶段」被别的套件用
              # get_build_dir引用(glibc:ES取charmaps; icu:自己--with-cross-build;
              # capsimg:hatarisa取LibIPF; 等)。checkpoint为省空间剥掉了build/，若某个
              # 这类套件在checkpoint里(有stamp)但缺build目录，清其stamp强制重编一次
              # 重新产生build目录。build目录还在的(如save保留的glibc/icu)不动。发现
              # 一个补一个进这个清单。
              for p in glibc icu libpcap capsimg gl4es enet zmusic math_neon cyclone68000 sdlgamecontrollerdb libdrm libepoxy libevdev go rust cargo-snapshot rustc-snapshot rust-std-snapshot opengl-meson mali-bifrost common_drivers media_modules-aml gpu-aml; do
                if [ -d "${BD}.stamps/${p}" ] && ! ls -d "${BD}build/${p}-"* >/dev/null 2>&1; then
                  echo "checkpoint有${p} stamp但缺build目錄，清stamp強制重編一次"
                  rm -rf "${BD}.stamps/${p}"
                fi
              done
            else
              echo "接力狀態拼回後損壞，丟棄，從零開始建置"
              rm -f "${STATE_FILE}"
              rm -rf build.*/
            fi
          else
            echo "沒有找到之前的接力狀態，從零開始建置"
            rm -rf "${STATE_DIR}"
          fi

      - name: Install build dependencies
        run: |
          # NOTE(w2xg2022): GitHub官方runner映像檔預裝了packages.microsoft.com
          # (azure-cli/microsoft-prod)的apt來源，我們的建置完全用不到Azure CLI，
          # 但這兩個來源偶爾會回403，apt-get update預設對任一來源失敗都回傳
          # 非零結束碼，搭配GitHub Actions的run:預設bash -e，整個step會在這裡
          # 直接中止(實測確認：ubuntu本身的套件列表都正常抓到，只有微軟這兩個
          # 來源出問題)。跟我們自己的原始碼完全無關，建置前先移除這兩個用不到
          # 的來源清單，避免apt-get update被它們拖垮。
          sudo grep -rl 'packages.microsoft.com' /etc/apt/sources.list.d/ 2>/dev/null | xargs -r sudo rm -f
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            gcc make git unzip wget xz-utils libsdl2-dev libsdl2-mixer-dev \
            libfreeimage-dev libfreetype6-dev libcurl4-openssl-dev rapidjson-dev \
            libasound2-dev libgl1-mesa-dev build-essential libboost-all-dev cmake \
            fonts-droid-fallback libvlc-dev libvlccore-dev vlc-bin texinfo premake4 \
            golang libssl-dev curl patchelf xmlstarlet default-jre xsltproc \
            libvpx-dev rdfind tzdata xfonts-utils lzop \
            libparse-yapp-perl gperf libxml-parser-perl patchutils zstd
          sudo apt-get clean

      - name: Build (${{ matrix.model }})
        run: |
          # NOTE(w2xg2022): /tmp掛在根目錄那個小分區(maximize-build-space沒擴充它，
          # 開局就只剩~100MB)，gcc預設把組譯暫存檔(.s等)寫到/tmp，kernel編譯量大時
          # 會把/tmp塞爆導致"No space left on device"，跟GITHUB_WORKSPACE大容量分區
          # 是否還有空間完全無關。改把TMPDIR指到大容量分區下的目錄。
          # root-reserve-mb從1024調到8192後仍在2小時後爆掉(runner自己的_diag log寫不進去)，
          # 懷疑是某些host端工具(pip/npm/go等)預設快取寫進$HOME(也在根目錄小分區)累積出來的，
          # 連HOME一起搬到大容量分區，徹底排除根目錄小分區的依賴。
          mkdir -p "${{ github.workspace }}/.tmp" "${{ github.workspace }}/.home"
          export TMPDIR="${{ github.workspace }}/.tmp"
          export HOME="${{ github.workspace }}/.home"
          (
            PROJECT=${{ env.PROJECT }} DEVICE=${{ env.DEVICE }} SUBDEVICE=${{ matrix.model }} \
            ARCH=${{ env.ARCH }} DISTRO=${{ env.DISTRO }} TMPDIR="${TMPDIR}" HOME="${HOME}" make image
          ) > build-${{ matrix.model }}.log 2>&1 &
          BUILD_PID=$!

          # NOTE(w2xg2022): GitHub的6小時硬上限會暴力砍斷整個job，來不及執行
          # 後面「打包存檔」的步驟。第一版設5小時40分，結果「開場準備(約15分)
          # +建置(5h40m)+存檔上傳(11GB要打包+上傳約20-30分)」加起來超過6小時，
          # 存檔被硬牆砍到一半、上傳出殘缺檔。改成建置只跑5小時整就主動停，
          # 留足足一小時給開場準備+存檔上傳，確保接力狀態能完整存進Release。
          MAX_BUILD_SECONDS=18000
          START_TS=$(date +%s)

          # 背景磁碟監控：可用空間<8GB時，自動清理已完成套件的build/原始編譯目錄
          # (保留install_pkg/成果，已驗證安全，最終映像組裝讀install_pkg不是build/)
          # NOTE(w2xg2022): maximize-build-space把大容量磁碟掛在GITHUB_WORKSPACE(這裡的CWD)，
          # 不是掛在根目錄"/"！根目錄本來就幾乎全滿跟建置無關，之前一直查"/"等於監控完全失效。
          while kill -0 $BUILD_PID 2>/dev/null; do
            sleep 60
            BUILD_DIR=$(ls -d build.*/ 2>/dev/null | head -1)
            AVAIL_GB=$(df --output=avail . | tail -1 | awk '{print int($1/1024/1024)}')
            ELAPSED=$(( $(date +%s) - START_TS ))
            echo "[monitor] $(date +%T) disk avail: ${AVAIL_GB}GB, elapsed: ${ELAPSED}s"
            if [ "$AVAIL_GB" -lt 15 ] && [ -n "$BUILD_DIR" ] && [ -d "${BUILD_DIR}install_pkg" ]; then
              echo "[monitor] disk low, cleaning completed packages' build/ dirs..."
              CLEANED=0
              for d in $(ls "${BUILD_DIR}install_pkg" 2>/dev/null); do
                # NOTE(w2xg2022): glibc/icu的build目錄在後面套件的安裝階段還會被引用
                # (glibc: ES取charmaps/localedef; icu: --with-cross-build)，不能清，
                # 否則ES/icu-dependent套件安裝時找不到build目錄而失敗。
                case "$d" in glibc-*|icu-*) continue;; esac
                if [ -d "${BUILD_DIR}build/$d" ]; then
                  rm -rf "${BUILD_DIR}build/$d"
                  CLEANED=$((CLEANED+1))
                fi
              done
              echo "[monitor] cleaned ${CLEANED} package build dirs"
              df -h .
            fi
            if [ "$ELAPSED" -ge "$MAX_BUILD_SECONDS" ]; then
              echo "[monitor] 時間快到6小時上限，主動停止建置以保留接力狀態..."
              kill -TERM $BUILD_PID 2>/dev/null
              sleep 15
              kill -KILL $BUILD_PID 2>/dev/null
              break
            fi
          done

          wait $BUILD_PID
          BUILD_EXIT=$?
          tail -100 build-${{ matrix.model }}.log
          echo "checkpoint_reason=timeout_self_stop_or_finished" >> "$GITHUB_OUTPUT" 2>/dev/null || true
          exit $BUILD_EXIT
        continue-on-error: true
        id: build_step

      - name: Save build checkpoint to Release (always)
        if: always()
        # NOTE(w2xg2022): 存checkpoint失敗(空間不足等)不該擋掉后面的韌體上傳。
        # continue-on-error讓Save失敗时job仍算成功、繼續跑Collect/Upload firmware，
        # 确保build成功产出的.img一定会被上传。
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          BUILD_DIR=$(ls -d build.*/ 2>/dev/null | head -1)
          if [ -z "$BUILD_DIR" ]; then
            echo "找不到建置資料夾，跳過存檔"
            exit 0
          fi
          # NOTE(w2xg2022): 前兩輪存檔都產出殘缺的~47MB檔，真兇是把11GB打包寫到
          # /tmp(在runner的小分區)，寫到47MB就把小分區塞爆、tar失敗，但原本結尾
          # 接了「| tail」讓管線結束碼變成tail的(永遠成功)，把tar的失敗整個蓋掉、
          # 誤報success。改成：(1)寫到大容量分區(workspace，跟52GB建置目錄同一顆)；
          # (2)set -o pipefail + 明確檢查tar結束碼，tar真的失敗就讓步驟報錯，不再
          # 上傳殘檔污染下一輪。
          STATE_FILE="${{ github.workspace }}/state.tar.zst"
          # 打包前清掉build/(各套件編譯暫存工作目錄，很肥)以騰出空間；但保留glibc/icu
          # 的build目錄——它們在後面套件的安裝階段還會被引用(glibc:ES取charmaps/localedef;
          # icu:--with-cross-build)，剝掉會讓還原後的組裝失敗。保留這兩個後，把它們也
          # 一併打包進checkpoint，下一輪還原就直接有、不用重編。
          echo "清理build/暫存工作目錄(保留glibc/icu)以騰出空間..."
          if [ -d "${BUILD_DIR}build" ]; then
            find "${BUILD_DIR}build" -mindepth 1 -maxdepth 1 -type d \
              ! -name 'glibc-*' ! -name 'icu-*' -exec rm -rf {} + 2>/dev/null || true
          fi
          # 收集要保留的glibc/icu build目錄(可能不存在，用glob展開)
          KEEP_BUILD=$(ls -d "${BUILD_DIR}build/glibc-"* "${BUILD_DIR}build/icu-"* 2>/dev/null)
          echo "打包接力狀態(工具鏈+已裝套件+進度標記+glibc/icu build)到大容量分區..."
          df -h "${{ github.workspace }}"
          if ! tar -I 'zstd -T0 -3' -cf "${STATE_FILE}" \
               "${BUILD_DIR}toolchain" "${BUILD_DIR}install_pkg" "${BUILD_DIR}.stamps" ${KEEP_BUILD}; then
            echo "打包失敗(多半是空間不足)，不上傳殘檔"
            rm -f "${STATE_FILE}"
            exit 1
          fi
          ls -lh "${STATE_FILE}"
          echo "本地二次驗證完整性..."
          zstd -t "${STATE_FILE}" || { echo "打包出來的檔自檢就損壞，不上傳"; rm -f "${STATE_FILE}"; exit 1; }
          # NOTE(w2xg2022): GitHub單一Release asset硬上限2GiB，實測2.5GB整包上傳
          # 直接HTTP 422 Validation Failed。且接力狀態會隨建置進度越來越大，只會
          # 更超標。改成切成1900MiB(安全低於2GiB)的多塊(state.tar.zst.partNN)分別
          # 上傳，還原時再照順序cat拼回。上傳前先刪掉Release上所有舊的state分塊，
          # 避免上一輪殘留的多餘分塊(例如上輪3塊這輪2塊，第3塊沒被覆蓋)污染拼接。
          rm -f "${STATE_FILE}".part*
          split -b 1900M -d -a 2 "${STATE_FILE}" "${STATE_FILE}.part"
          rm -f "${STATE_FILE}"
          ls -lh "${{ github.workspace }}"/state.tar.zst.part*
          RELEASE_TAG="build-state-${{ matrix.model }}"
          gh release view "${RELEASE_TAG}" --repo ${{ github.repository }} >/dev/null 2>&1 || \
            gh release create "${RELEASE_TAG}" --repo ${{ github.repository }} \
              --title "建置接力狀態(自動，${{ matrix.model }})" \
              --notes "自動保存的建置中間狀態(切塊)，供下一輪雲編譯接續使用，不是可安裝的韌體。"
          for a in $(gh release view "${RELEASE_TAG}" --repo ${{ github.repository }} --json assets -q '.assets[].name' 2>/dev/null); do
            case "$a" in state.tar.zst*) echo "刪除舊分塊 $a"; gh release delete-asset "${RELEASE_TAG}" "$a" --repo ${{ github.repository }} --yes || true;; esac
          done
          for p in "${{ github.workspace }}"/state.tar.zst.part*; do
            echo "上傳 $(basename "$p") ..."
            gh release upload "${RELEASE_TAG}" "$p" --repo ${{ github.repository }} --clobber
          done

      - name: Fail job if build did not actually succeed
        if: steps.build_step.outcome != 'success'
        run: |
          echo "本輪建置未完整跑完(逾時自停或真的失敗)，接力狀態已存檔，等下一輪繼續。"
          exit 1

      - name: Collect artifacts
        id: collect
        run: |
          mkdir -p out
          find . -maxdepth 3 -type d -name "target" -exec sh -c 'cp -v "$1"/*.img.gz out/ 2>/dev/null; cp -v "$1"/*.img.xz out/ 2>/dev/null; cp -v "$1"/*.tar out/ 2>/dev/null' _ {} \;
          find . -maxdepth 6 -iname "*${{ env.DISTRO }}*${{ matrix.model }}*" \( -iname "*.img.gz" -o -iname "*.img.xz" -o -iname "*.tar" \) -exec cp -v {} out/ \; 2>/dev/null || true
          ls -la out/ || echo "no artifacts found, check build log"

      - name: Upload build log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.model }}
          path: build-${{ matrix.model }}.log
          retention-days: 14

      - name: Upload firmware artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: EmuELEC-${{ matrix.model }}
          path: out/*
          if-no-files-found: warn

      - name: Create release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ matrix.model }}-${{ github.run_id }}
          name: "EmuELEC ${{ matrix.model }} (${{ github.run_id }})"
          files: out/*
          body: |
            自动云编译：${{ env.PROJECT }}/${{ env.DEVICE }} SUBDEVICE=${{ matrix.model }}
            触发方式：${{ github.event_name }}

      # NOTE(w2xg2022): 只有真的完整編出韌體(success)才記錄本次commit到built-commit
      # 這個Release的body，供下次schedule觸發時的gate比對「代碼有沒有變」。
      - name: Record built commit
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view built-commit --repo ${{ github.repository }} >/dev/null 2>&1; then
            gh release edit built-commit --repo ${{ github.repository }} --notes "${{ github.sha }}"
          else
            gh release create built-commit --repo ${{ github.repository }} \
              --title "上次成功建置的commit(月度cron的gate用)" --notes "${{ github.sha }}"
          fi
          echo "已記錄本次成功建置的commit：${{ github.sha }}"
