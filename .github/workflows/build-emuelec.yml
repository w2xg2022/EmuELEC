name: Build EmuELEC

on:
  workflow_dispatch:
    inputs:
      models:
        description: '要编译的型号列表(空格分隔)，留空则用 repo variable MODELS'
        required: false
        default: ''
      rebuild_kernel:
        description: '强制重编内核+initramfs(修复缓存的KERNEL烤进空initramfs的坑,用一次即可)'
        type: boolean
        required: false
        default: false
  # NOTE(w2xg2022): 月度cron暂时停用——目前还在适配期(平行编译/接力机制调试中)，
  # 先不让它自动触发以免干扰或浪费云端时数。适配稳定后把下面schedule取消注释即可
  # 重新启用。启用后的逻辑已做好(见prepare的gate步骤)：仅在repo commit相对上次
  # 成功建置有变动时才真的编，没变就整轮skip；有变也靠接力checkpoint+.stamps只重
  # 编改动到的套件，不会每月从零全编。
  # schedule:
  #   # 每月1号 03:00 UTC
  #   - cron: '0 3 1 * *'

permissions:
  contents: write

env:
  PROJECT: Amlogic-ce
  DEVICE: Amlogic-no
  ARCH: aarch64
  DISTRO: EmuELEC

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
      needed: ${{ steps.gate.outputs.needed }}
    steps:
      - id: set
        run: |
          MODELS="${{ github.event.inputs.models }}"
          if [ -z "$MODELS" ]; then
            MODELS="${{ vars.MODELS }}"
          fi
          if [ -z "$MODELS" ]; then
            MODELS="X98mini"
          fi
          JSON=$(printf '%s\n' $MODELS | jq -R . | jq -s -c .)
          echo "matrix=$JSON" >> "$GITHUB_OUTPUT"
          echo "Models to build: $MODELS"
      # NOTE(w2xg2022): 「代码没变就不编」闸门。手动触发(workflow_dispatch)一律建置；
      # 只有排程(schedule)触发时，才比对现在的commit跟上次成功建置记录的commit
      # (存在built-commit这个Release的body)。一样就整轮skip，省掉没必要的月度重建。
      - id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "手动触发，一律建置"
            echo "needed=yes" >> "$GITHUB_OUTPUT"; exit 0
          fi
          LAST=$(gh release view built-commit --repo ${{ github.repository }} --json body -q .body 2>/dev/null | tr -d '[:space:]')
          NOW="${{ github.sha }}"
          if [ -n "$LAST" ] && [ "$LAST" = "$NOW" ]; then
            echo "代码自上次成功建置以来未变($NOW)，跳过本次月度重建"
            echo "needed=no" >> "$GITHUB_OUTPUT"
          else
            echo "代码有变(上次:${LAST:-无} 现在:$NOW)，执行建置"
            echo "needed=yes" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: prepare
    if: needs.prepare.outputs.needed == 'yes'
    # NOTE(w2xg2022): 用ubuntu-22.04——这是实测能一路建完base到515的已知环境。曾为
    # VM-base seed短暂改24.04(VM host工具需glibc2.39)，但VM-base搬云端不可携(host工具
    # 绑死VM的glibc+CPU)已放弃；且24.04的系统autotools较新会让libtool的autoreconf挂
    # (cannot open libltdl/ltdl.mk)。故回22.04。
    runs-on: ubuntu-22.04
    # NOTE(w2xg2022): GitHub代管runner有硬性6小时(360分钟)执行上限，timeout-minutes
    # 设更高也没用，runner基础设施会强制中止。实测跑到350分钟进度497/639且过程中
    # 完全没有错误(纯粹被逾时砍掉)，代表之前修的所有上游来源/编译问题都真的解决了，
    # 剩下的是单纯"时间不够"，靠下面新增的ccache跨次建置快取来解，不是硬干拉长时间。
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        model: ${{ fromJson(needs.prepare.outputs.matrix) }}
    steps:
      # NOTE(w2xg2022): ★apt 必须排在 Maximize build space 之前★(2026-07-17 从原始 job log 坐实)
      # 真因不是「依赖太肥」(去重后实测仅约 2.5G,download 只要 198MB),而是
      # ★maximize 跑完后 root 只剩 100M 可用★:
      #   maximize 之前  /dev/root 146G  58G  88G  40% /
      #   maximize 之后  /dev/root 146G 146G 100M 100% /   ← apt 要 198MB,当然装不下
      # 为何只剩 100M —— 见下面 Maximize 那步的 NOTE:这台 runner 的 /mnt 就在 root 上,
      # 该 action 对同一颗磁碟挖两次,真正生效的保留量是 temp-reserve-mb(100 MiB),
      # 不是 root-reserve-mb。故 apt 提前到此处跑(root 尚有 88G)是唯一可靠的解。
      # 失败指纹存参:「E: You don't have enough free space in /var/cache/apt/archives/」+ exit 100
      # (外层 step 汇总成 exit 2,别被外层的 2 骗了,要拉 job 原始 log 看内层)。
      # ⚠️ 100M vs 198MB 属边缘值 → 会「时好时坏」(f90330b 过、内容一字不差的 742e9bc 挂),
      # 别因为偶尔能过就以为与空间无关;资源卡在临界值同样会时好时坏。
      - name: Install build dependencies
        run: |
          # NOTE(w2xg2022): GitHub官方runner映像档预装了packages.microsoft.com
          # (azure-cli/microsoft-prod)的apt来源，我们的建置完全用不到Azure CLI，
          # 但这两个来源偶尔会回403，apt-get update预设对任一来源失败都回传
          # 非零结束码，搭配GitHub Actions的run:预设bash -e，整个step会在这里
          # 直接中止(实测确认：ubuntu本身的套件列表都正常抓到，只有微软这两个
          # 来源出问题)。跟我们自己的原始码完全无关，建置前先移除这两个用不到
          # 的来源清单，避免apt-get update被它们拖垮。
          sudo grep -rl 'packages.microsoft.com' /etc/apt/sources.list.d/ 2>/dev/null | xargs -r sudo rm -f
          # NOTE(w2xg2022): 重试纯粹是对「mirror 暂时性 5xx/超时」的便宜保险(一挂就是整个 job 白跑)。
          # ★重试救不了空间不足★(retry 不会生出磁碟);空间那件事是靠「apt 排在 maximize 之前」
          # 加上 temp-reserve-mb 解决的,见上方与 Maximize 那步的 NOTE。别把两者搞混。
          retry() {
            local i
            for i in 1 2 3; do
              "$@" && return 0
              echo "::warning::apt 第 ${i} 次失败($*),$((i*15))s 后重试"
              sleep $((i*15))
            done
            echo "::error::apt 重试 3 次仍失败: $*"
            return 1
          }
          retry sudo apt-get update
          retry sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            gcc make git unzip wget xz-utils libsdl2-dev libsdl2-mixer-dev \
            libfreeimage-dev libfreetype6-dev libcurl4-openssl-dev rapidjson-dev \
            libasound2-dev libgl1-mesa-dev build-essential libboost-all-dev cmake \
            fonts-droid-fallback libvlc-dev libvlccore-dev vlc-bin texinfo premake4 \
            golang libssl-dev curl patchelf xmlstarlet default-jre xsltproc \
            libvpx-dev rdfind tzdata xfonts-utils lzop \
            libparse-yapp-perl gperf libxml-parser-perl patchutils zstd
          sudo apt-get clean

      - name: Maximize build space
        uses: easimon/maximize-build-space@v10
        with:
          # ★★★ NOTE(w2xg2022) 2026-07-17 从 action 自己的 log 坐实,务必先读完再动这几个值 ★★★
          # 这台 runner ★没有独立的 /mnt 暂存碟★(maximize 前的 df 只有 /dev/root + 3 个 tmpfs),
          # 也就是 /mnt 就在 root 檔案系统上。而该 action 是「双 PV」设计,对同一颗磁碟挖两刀:
          #   ① /pv.img        = ROOT_FREE(88G) - root-reserve(16G) = 72G  → root 剩 16G
          #   ② /mnt/tmp-pv.img= TMP_FREE (16G) - temp-reserve(100M) = 15.9G → root 剩 100M ★
          # 第二刀把第一刀留的 16G 又吃光 → ★真正生效的保留量是 temp-reserve-mb,不是
          # root-reserve-mb★。实测 df 正好剩 100M,与 temp-reserve 预设值一字不差。
          # 这也解释了历史上「root-reserve 从 1024→8192→16384 一路调大却毫无效果」——那个旋钮
          # 在这台 runner 上从头到尾没生效过,调它是白工。要留空间给 root 就得调 temp-reserve-mb。
          # 现设 temp-reserve-mb: 4096 → root 实际保有 4G(而非 100M),代价是 build LVM
          # 少 4G(约 88G→84G;核心已改预编译下载,不再本地编 MAME 等大户,空间充裕)。
          # ⚠️ 别把 temp-reserve-mb 设到 >= root-reserve-mb:第二刀会算出负数/0,fallocate 会炸。
          root-reserve-mb: 16384
          temp-reserve-mb: 4096
          swap-size-mb: 512
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - name: Show disk space
        run: df -h

      - name: Checkout
        uses: actions/checkout@v4

      # NOTE(w2xg2022): linux(核心)与跟它「同批编译才安全」的驱动模块(gpu-aml/
      # media_modules-aml/各wifi-bt驱动等，判断依据：PKG_IS_KERNEL_PKG="yes"或
      # PKG_NEED_UNPACK="${LINUX_DEPENDS}"，即会用kernel_path/get_build_dir linux
      # 引用核心build目录来编译外挂.ko模块)，过去靠checkpoint的手写force-rebuild
      # 清单来管理，绕过了build系统自己的PKG_DEPENDS_TARGET依赖图，一旦清单漏列
      # 或核心被意外重编、驱动模块没跟着重编，就会vermagic对不上(表现为卡开机)。
      # 改成把这批包整组当一个「原子kernel bundle」：用它们的package.mk+patches
      # 内容杂凑当版本键，杂凑不变=直接整组复用，杂凑一变=整组一起重编，绝不会
      # 只重编其中一部分。此步骤只算杂凑，不碰任何文件。
      - name: Compute kernel bundle hash
        run: |
          KERNEL_PKGS="linux gpu-aml media_modules-aml aic8800-sdio ap6xxx-aml mt76 mt7668-wifi-bt RTL8189FS RTL8723DS-aml RTL8851BU RTL8852BE-aml RTL8852BS-aml RTW88 w1-aml wifi_dummy-aml"
          # ★★★ 2026-07-17 坐实的非决定性 bug + 修法(务必保留 sort)★★★
          # 症状:c156a8c 与 cfe25b8 的 kernel 档案「一字不差」(VM 上两 commit 算出同一个
          # 73e24e0b),runner 却给出不同 hash(4ca7429c vs 2ba8461a)→ bundle 永远命不中、
          # 每轮都重编 kernel(~2h),40 分钟只在偶然命中时出现。
          # 根因:下面 `grep -rl` 的输出★未排序★,而外层 for 循环按该顺序把各目录 hash 串接
          # (linux 就匹配 4 个 package.mk、多数套件跨设备树匹配 2 个,共 26 个),顺序一变
          # 串接结果就变。VM 上档案系统列举顺序稳定所以一致;runner 每轮 mkfs 全新 buildlv,
          # 列举顺序会变 → 同源不同 hash。实测:正序/反序/sort 三种顺序 → 三个不同 hash。
          # 修法:`| sort` 让档案清单顺序与档案系统无关,保证同源必同 hash。内层 find 早已 sort。
          HASH_INPUT=""
          for pkg in $KERNEL_PKGS; do
            for f in $(grep -rl "^PKG_NAME=\"${pkg}\"\$" packages/ projects/ 2>/dev/null | sort); do
              d=$(dirname "$f")
              HASH_INPUT="$HASH_INPUT $(find "$d" -type f | sort | xargs sha256sum 2>/dev/null | sha256sum | cut -d' ' -f1)"
            done
          done
          KERNEL_HASH=$(echo "$HASH_INPUT" | sha256sum | cut -c1-16)
          echo "KERNEL_HASH=$KERNEL_HASH" >> "$GITHUB_ENV"
          echo "本次kernel lane内容杂凑：$KERNEL_HASH（由linux+14个耦合驱动包的package.mk+patches内容决定）"

      # NOTE(w2xg2022): 之前用actions/cache存sources/ccache，但GitHub的6小时硬上限
      # 是暴力砍断整个job，来不及跑cache的储存(post)步骤，导致快取永远存不进去，
      # 每次都从零开始编到差不多同一个进度又被砍，等于白做。改用GitHub Release
      # 当作「建置接力状态」的存放点：把工具链+已装好的套件+进度标记(.stamps)
      # 打包成一个档案存进Release，不受6小时job生命周期限制，下一轮开工前先
      # 还原回来，让建置系统(靠.stamps判断哪些套件已经装好)自动接著编，不用
      # 重头来过。真正确保「存档」这步会执行，Build步骤本身会在时间快到前
      # 自己主动停下来(见下面的timeout设计)，而不是被GitHub暴力砍断。
      - name: Restore build checkpoint from Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAG="build-state-${{ matrix.model }}"
          # NOTE(w2xg2022): 接力状态被切成多块(state.tar.zst.partNN，各<2GiB绕开
          # GitHub单一asset上限)。下载全部分块到大容量分区(不能放/tmp小分区)，
          # 照顺序cat拼回完整档再验证。
          STATE_FILE="${{ github.workspace }}/state.tar.zst"
          STATE_DIR="${{ github.workspace }}/_state_parts"
          mkdir -p "${STATE_DIR}"
          if gh release download "${RELEASE_TAG}" -p 'state.tar.zst.part*' -D "${STATE_DIR}" --repo ${{ github.repository }} 2>/dev/null && ls "${STATE_DIR}"/state.tar.zst.part* >/dev/null 2>&1; then
            echo "找到上一轮的接力状态分块，拼回中..."
            ls -lh "${STATE_DIR}"/state.tar.zst.part*
            cat "${STATE_DIR}"/state.tar.zst.part* > "${STATE_FILE}"
            rm -rf "${STATE_DIR}"
            ls -lh "${STATE_FILE}"
            # 拼回后先用zstd -t验证完整性，损坏(存档曾被砍/分块缺失)就丢弃从零开始，
            # 绝不能拿半残的状态去接续(.stamps会误判某些套件已装好但档案其实不完整)。
            if zstd -t "${STATE_FILE}" 2>/dev/null; then
              echo "完整性OK，还原中..."
              tar -I zstd -xf "${STATE_FILE}" -C "${{ github.workspace }}"
              rm -f "${STATE_FILE}"
              echo "还原完成："
              du -sh build.*/toolchain build.*/install_pkg build.*/.stamps 2>/dev/null
              # NOTE(w2xg2022): glibc/icu在「安装阶段」会回头引用自己的build目录
              # (glibc: emuelec-emulationstation取charmaps/localedef; icu: --with-cross-build
              # 要host build目录)。checkpoint为省空间剥掉了build/，若还原的旧checkpoint
              # 没带这两个的build目录，就清掉它们的.stamps强制重编一次(重编会重新产生
              # build目录)。之后的存档会保留这两个build目录(见save步骤)，所以只有第一次
              # 用旧checkpoint时会重编。
              BD=$(ls -d build.*/ 2>/dev/null | head -1)
              # NOTE(w2xg2022): 这些套件的build目录会在「安装阶段」被别的套件用
              # get_build_dir引用(glibc:ES取charmaps; icu:自己--with-cross-build;
              # capsimg:hatarisa取LibIPF; 等)。checkpoint为省空间剥掉了build/，若某个
              # 这类套件在checkpoint里(有stamp)但缺build目录，清其stamp强制重编一次
              # 重新产生build目录。build目录还在的(如save保留的glibc/icu)不动。发现
              # 一个补一个进这个清单。
              # NOTE(w2xg2022): linux已移出这份清单——kernel(及其耦合驱动模组)现在由
              # 下面独立的「Restore kernel bundle」步骤原子化接管，不再靠这里的手写
              # 清单个别补救，避免重蹈「核心被强制重编、驱动模组没跟著重编」的覆辙。
              for p in glibc icu libpcap capsimg gl4es enet zmusic math_neon cyclone68000 sdlgamecontrollerdb libdrm libepoxy libevdev go rust cargo-snapshot rustc-snapshot rust-std-snapshot opengl-meson; do
                if [ -d "${BD}.stamps/${p}" ] && ! ls -d "${BD}build/${p}-"* >/dev/null 2>&1; then
                  echo "checkpoint有${p} stamp但缺build目录，清stamp强制重编一次"
                  rm -rf "${BD}.stamps/${p}"
                fi
              done
              # ★2026-07-12 根治花屏(真根因)★:同理修 install_init。旧 checkpoint 只存了 .stamps
              # 没存 install_init/,还原后 build_init 标记在=以为 init 装好而跳过,但 install_init/<pkg>/
              # 内容没了 → initramfs 缺 glibc 等 → 花屏。对 initramfs 包集:build_init 标记在但
              # install_init/<pkg> 缺,就清 build_init 强制重装 init(不清 build 目录,init 装配读得到 .so)。
              for p in glibc busybox gcc util-linux e2fsprogs dosfstools splash-image terminus-font bkeymaps; do
                if [ -f "${BD}.stamps/${p}/build_init" ] && ! ls -d "${BD}install_init/${p}-"* >/dev/null 2>&1; then
                  echo "checkpoint有${p} build_init标记但缺install_init目录，清build_init强制重装init"
                  rm -f "${BD}.stamps/${p}/build_init"
                fi
              done
            else
              echo "接力状态拼回后损坏，丢弃，从零开始建置"
              rm -f "${STATE_FILE}"
              rm -rf build.*/
            fi
          else
            echo "没有找到之前的接力状态，从零开始建置"
            rm -rf "${STATE_DIR}"
          fi

      # NOTE(w2xg2022): 在通用checkpoint还原「之后」执行，确保kernel bundle的
      # .stamps/install_pkg一定是最终覆盖、最终生效的版本——就算通用checkpoint
      # 里残留旧的、不成套的kernel相关内容，这步骤也会用「整组杂凑比对过」的
      # 原子bundle盖过去，永远不会出现部分新、部分旧的错位组合。
      - name: Restore kernel bundle from Release (atomic kernel+driver set)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAG="kernel-state-${{ matrix.model }}-${KERNEL_HASH}"
          BD=$(ls -d build.*/ 2>/dev/null | head -1)
          if [ -z "$BD" ]; then
            echo "尚无build目录(全新建置)，kernel bundle将在本轮build完后产生并快取"
            exit 0
          fi
          KSTATE="${{ github.workspace }}/kstate.tar.zst"
          if gh release download "${RELEASE_TAG}" -p 'kstate.tar.zst' -O "${KSTATE}" --repo ${{ github.repository }} 2>/dev/null; then
            echo "找到杂凑相符的kernel bundle(${KERNEL_HASH})，还原中(整组原子覆盖，确保核心与驱动模组永远同批)..."
            if zstd -t "${KSTATE}" 2>/dev/null; then
              tar -I zstd -xf "${KSTATE}" -C "${BD}"
              rm -f "${KSTATE}"
              echo "kernel bundle还原完成，本轮跳过重编linux及其耦合驱动包"
            else
              echo "kernel bundle损坏，丢弃，本轮将重编整组kernel lane"
              rm -f "${KSTATE}"
            fi
          else
            echo "没有杂凑${KERNEL_HASH}对应的kernel bundle(首次建置或kernel/驱动有改动)，本轮将重编整组kernel lane"
          fi

      - name: Build (${{ matrix.model }})
        run: |
          # NOTE(w2xg2022): /tmp挂在根目录那个小分区(maximize-build-space没扩充它，
          # 开局就只剩~100MB)，gcc预设把组译暂存档(.s等)写到/tmp，kernel编译量大时
          # 会把/tmp塞爆导致"No space left on device"，跟GITHUB_WORKSPACE大容量分区
          # 是否还有空间完全无关。改把TMPDIR指到大容量分区下的目录。
          # root-reserve-mb从1024调到8192后仍在2小时后爆掉(runner自己的_diag log写不进去)，
          # 怀疑是某些host端工具(pip/npm/go等)预设快取写进$HOME(也在根目录小分区)累积出来的，
          # 连HOME一起搬到大容量分区，彻底排除根目录小分区的依赖。
          mkdir -p "${{ github.workspace }}/.tmp" "${{ github.workspace }}/.home"
          export TMPDIR="${{ github.workspace }}/.tmp"
          export HOME="${{ github.workspace }}/.home"

          # NOTE(w2xg2022): ★initramfs自愈★——若某initramfs相关包已标记完成(stamp在)但
          # build/目录缺失(从旧checkpoint还原、或被裁掉),make image的(init)安装会从缺失的
          # $PKG_BUILD复制到0文件→initramfs打包成空(195B ramdisk)→固件卡开机。这里检测并
          # 清掉这些包的stamp强制重编(重建build/),保证initramfs能正确组出。有build/的不动
          # (走快取,不浪费时间)。首轮bootstrap会重编含gcc(~慢),之后checkpoint已保留其build/
          # (见Save步骤)就不再重编。
          BD_FIX=$(ls -d build.*/ 2>/dev/null | head -1)
          if [ -n "$BD_FIX" ]; then
            for p in busybox gcc util-linux e2fsprogs dosfstools splash-image terminus-font bkeymaps initramfs; do
              if ls "${BD_FIX}.stamps/${p}/"* >/dev/null 2>&1 && ! ls -d "${BD_FIX}build/${p}-"* >/dev/null 2>&1; then
                echo "[initramfs自愈] ${p}: build/缺失但已标记完成 → 清stamp强制重编"
                rm -rf "${BD_FIX}.stamps/${p}"
              fi
            done
            # NOTE(w2xg2022): ★rebuild_kernel开关★——坏的KERNEL(烤进空initramfs)会被缓存进
            # install_pkg/linux+kernel bundle,后续run即使build/补回来也不会重烤KERNEL(stamp
            # 已完成)。手动触发rebuild_kernel=true时,清掉linux+initramfs的stamp/install_pkg/image,
            # 强制它们连同KERNEL bootimg一起重建(用已修好的build/→好initramfs烤进KERNEL)。
            # ★2026-07-11教训★：第一版只清了linux+initramfs两个包，结果新编的kernel配上了
            # kernel bundle里其余14个耦合驱动包(gpu-aml/media_modules-aml/w1-aml等)的旧.ko
            # (从checkpoint还原、对应旧kernel，未跟着重编)——vermagic/符号不匹配，驱动加载
            # 失败，gpu-aml(Mali显示驱动)挂了直接花屏/雪花。教训：kernel bundle是"linux+14个
            # 驱动"绑定的一个原子集合，重编kernel时**必须把整组15个包一起清掉重编**，不能只动
            # linux，否则新旧kernel/驱动版本错位。
            # 决定是否重建整组kernel lane：①手动rebuild_kernel=true ②★自愈检测★
            NEED_KREBUILD=0
            [ "${{ github.event.inputs.rebuild_kernel }}" = "true" ] && NEED_KREBUILD=1
            # ★自愈★：检查缓存的 install_pkg/linux/.image/Image.lzo(烤好的KERNEL)里的
            # initramfs 是否完好——不仅要非空,还必须含 glibc 动态链接器(ld-linux-aarch64.so.1)。
            # ★2026-07-12根因坐实★：花屏/雪花的真凶=云端缓存的 glibc build/ 不完整,glibc 的
            # makeinstall_init 复制不到 ld*.so/libc.so → initramfs 缺 glibc → busybox(动态链接)
            # exec 失败 → 内核 panic → 花屏。这种 initramfs 仍有 3MB(只看大小抓不到),必须
            # 检查内容有没有 libc。检测脚本见 .github/scripts/check-image-initramfs.sh。
            LZO=$(ls "${BD_FIX}install_pkg/linux-"*/.image/Image.lzo 2>/dev/null | head -1)
            if [ "$NEED_KREBUILD" = 0 ] && [ -f "$LZO" ]; then
              if bash "${{ github.workspace }}/.github/scripts/check-image-initramfs.sh" "$LZO"; then
                echo "[KERNEL自愈] 缓存Image.lzo的initramfs完好(含glibc),跳过kernel重建"
              else
                echo "[KERNEL自愈] 缓存Image.lzo的initramfs损坏→自动升级为整组kernel lane重建"
                NEED_KREBUILD=1
              fi
            fi
            if [ "$NEED_KREBUILD" = 1 ]; then
              # ★必须连 glibc/libc 一起重建★：花屏根因就是 glibc build/ 不完整,只重编 linux/
              # 驱动而不重编 glibc,glibc 的 .<target>/elf/ld*.so 还是缺,initramfs 照样没 libc。
              echo "[kernel重建] 强制重建 glibc + 整组kernel bundle(linux+14驱动) + initramfs + 重烤KERNEL"
              # ★★★ 2026-07-17 坐实的恶性循环,这行是解药 ★★★
              # 本轮真的重编了 kernel lane → 必须让后面的「Save kernel bundle」把成果覆盖回去。
              # 旧逻辑只认手动 rebuild_kernel=true,自愈重编的好 KERNEL 会被丢掉(save 步骤 1 秒
              # 就 exit 0,输出「杂凑xxx的kernel bundle已存在，无需重复上传」)→ 坏 bundle 永远
              # 留着 → 下一轮又侦测到坏 → 又重编 103 分钟 → 又拒绝存回。run 29572079462 实测:
              # 全轮 1h52m,其中 Build 103m(91.7%)整段就是这个白烧的重建,且成果照样被丢弃。
              # ★这个坑是静默的★:没有任何错误讯息,只表现为「编译莫名其妙变慢一倍」。
              echo "KERNEL_REBUILT=1" >> "$GITHUB_ENV"
              for kp in glibc libc linux gpu-aml media_modules-aml aic8800-sdio ap6xxx-aml mt76 mt7668-wifi-bt \
                        RTL8189FS RTL8723DS-aml RTL8851BU RTL8852BE-aml RTL8852BS-aml RTW88 \
                        w1-aml wifi_dummy-aml initramfs; do
                rm -rf "${BD_FIX}.stamps/${kp}" "${BD_FIX}install_pkg/${kp}-"* 2>/dev/null
                # NOTE(w2xg2022): ★不要清 glibc/libc 的 build/ 目录★(2026-07-12 VM 实测坐实)。
                # glibc 的 .so 本来就在 checkpoint 保留的 build/ 里,init 安装(makeinstall_init)读得到;
                # 清了 build/ 反而害 glibc 只重编 target、init 安装拿不到 .so → install_init/glibc 空 →
                # initramfs 缺 libc → 花屏。真根因是 checkpoint 没存 install_init(见 save 步骤 + 上面
                # restore 的 install_init 自愈),不是 build/ 残缺。
              done
              rm -rf "${BD_FIX}image" 2>/dev/null
            fi
          fi
          (
            PROJECT=${{ env.PROJECT }} DEVICE=${{ env.DEVICE }} SUBDEVICE=${{ matrix.model }} \
            ARCH=${{ env.ARCH }} DISTRO=${{ env.DISTRO }} TMPDIR="${TMPDIR}" HOME="${HOME}" make image
          ) > build-${{ matrix.model }}.log 2>&1 &
          BUILD_PID=$!

          # NOTE(w2xg2022): GitHub的6小时硬上限会暴力砍断整个job，来不及执行
          # 后面「打包存档」的步骤。第一版设5小时40分，结果「开场准备(约15分)
          # +建置(5h40m)+存档上传(11GB要打包+上传约20-30分)」加起来超过6小时，
          # 存档被硬墙砍到一半、上传出残缺档。改成建置只跑5小时整就主动停，
          # 留足足一小时给开场准备+存档上传，确保接力状态能完整存进Release。
          MAX_BUILD_SECONDS=18000
          START_TS=$(date +%s)

          # 背景磁碟监控：可用空间<8GB时，自动清理已完成套件的build/原始编译目录
          # (保留install_pkg/成果，已验证安全，最终映像组装读install_pkg不是build/)
          # NOTE(w2xg2022): maximize-build-space把大容量磁碟挂在GITHUB_WORKSPACE(这里的CWD)，
          # 不是挂在根目录"/"！根目录本来就几乎全满跟建置无关，之前一直查"/"等于监控完全失效。
          while kill -0 $BUILD_PID 2>/dev/null; do
            sleep 60
            BUILD_DIR=$(ls -d build.*/ 2>/dev/null | head -1)
            AVAIL_GB=$(df --output=avail . | tail -1 | awk '{print int($1/1024/1024)}')
            ELAPSED=$(( $(date +%s) - START_TS ))
            echo "[monitor] $(date +%T) disk avail: ${AVAIL_GB}GB, elapsed: ${ELAPSED}s"
            if [ "$AVAIL_GB" -lt 15 ] && [ -n "$BUILD_DIR" ] && [ -d "${BUILD_DIR}install_pkg" ]; then
              echo "[monitor] disk low, cleaning completed packages' build/ dirs..."
              CLEANED=0
              for d in $(ls "${BUILD_DIR}install_pkg" 2>/dev/null); do
                # NOTE(w2xg2022): glibc/icu的build目录在后面套件的安装阶段还会被引用
                # (glibc: ES取charmaps/localedef; icu: --with-cross-build)，不能清，
                # 否则ES/icu-dependent套件安装时找不到build目录而失败。
                # NOTE(w2xg2022): linux不再需要在这里特殊保留——kernel bundle只快取
                # .stamps+install_pkg，不需要build/linux-*，可以像一般套件一样清理。
                # NOTE(w2xg2022): ★initramfs相关包的build/绝不能清★——make image的
                # initramfs「(init)安装」pass是从$PKG_BUILD(build/)复制文件进initramfs根
                # (busybox/util-linux等的makeinstall_init),不是读install_pkg。清了build/
                # 会导致initramfs打包成空(1024B→195B ramdisk)、固件卡开机(SYSTEM正常但
                # 无initramfs)。这几个=log里有(init)安装的11个包。
                case "$d" in glibc-*|icu-*|busybox-*|gcc-*|util-linux-*|e2fsprogs-*|dosfstools-*|splash-image-*|terminus-font-*|bkeymaps-*|initramfs-*) continue;; esac
                if [ -d "${BUILD_DIR}build/$d" ]; then
                  rm -rf "${BUILD_DIR}build/$d"
                  CLEANED=$((CLEANED+1))
                fi
              done
              echo "[monitor] cleaned ${CLEANED} package build dirs"
              df -h .
            fi
            if [ "$ELAPSED" -ge "$MAX_BUILD_SECONDS" ]; then
              echo "[monitor] 时间快到6小时上限，主动停止建置以保留接力状态..."
              kill -TERM $BUILD_PID 2>/dev/null
              sleep 15
              kill -KILL $BUILD_PID 2>/dev/null
              break
            fi
          done

          wait $BUILD_PID
          BUILD_EXIT=$?
          tail -100 build-${{ matrix.model }}.log
          echo "checkpoint_reason=timeout_self_stop_or_finished" >> "$GITHUB_OUTPUT" 2>/dev/null || true
          exit $BUILD_EXIT
        continue-on-error: true
        id: build_step

      # NOTE(w2xg2022): 只有linux+14个耦合驱动包「全部」都有安装完成标记(整组真正
      # 编完，不是编到一半)才快取，且用内容杂凑当Release tag，同杂凑已存在就不重复
      # 上传。这样kernel bundle永远是「整组一起成功」的原子快照，之后只要源码没动
      # 这批包，任何一轮建置都能直接复用、完全跳过重编。
      - name: Save kernel bundle to Release (atomic kernel+driver set)
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          KERNEL_PKGS="linux gpu-aml media_modules-aml aic8800-sdio ap6xxx-aml mt76 mt7668-wifi-bt RTL8189FS RTL8723DS-aml RTL8851BU RTL8852BE-aml RTL8852BS-aml RTW88 w1-aml wifi_dummy-aml"
          BD=$(ls -d build.*/ 2>/dev/null | head -1)
          if [ -z "$BD" ]; then echo "无build目录，跳过"; exit 0; fi
          MISSING=0
          for p in $KERNEL_PKGS; do
            [ -d "${BD}.stamps/${p}" ] || { echo "缺 ${p} 的安装完成标记，kernel lane本轮未整组编完，不快取"; MISSING=1; }
          done
          if [ "$MISSING" = "1" ]; then exit 0; fi
          RELEASE_TAG="kernel-state-${{ matrix.model }}-${KERNEL_HASH}"
          if gh release view "${RELEASE_TAG}" --repo ${{ github.repository }} >/dev/null 2>&1; then
            # NOTE(w2xg2022): 同hash的旧bundle在「本轮真的重编过kernel」时必须覆盖——
            # 旧bundle烤进了空initramfs是坏的,必须用本轮重编的好bundle替换,否则下轮又还原坏的。
            # ★2026-07-17 修★:触发条件不能只认手动 rebuild_kernel=true,还要认 KERNEL_REBUILT=1
            # (Build 步骤里自愈侦测到坏 Image.lzo 而重建时会写进 GITHUB_ENV)。
            # 旧逻辑漏了自愈这条 → 自愈花 103 分钟编出的好 KERNEL 被丢掉、坏 bundle 永远留着
            # → 每一轮都重蹈覆辙(run 29572079462: 1h52m,其中 103m 全花在这个白烧的重建上)。
            # ★这个坑是静默的★:不报错,只表现为「编译莫名其妙变慢一倍」,极难察觉。
            if [ "${{ github.event.inputs.rebuild_kernel }}" = "true" ] || [ "${KERNEL_REBUILT:-0}" = "1" ]; then
              if [ "${KERNEL_REBUILT:-0}" = "1" ]; then
                echo "本轮自愈重编了kernel lane(KERNEL_REBUILT=1) → 删除旧的坏bundle,用本轮的好bundle覆盖"
              else
                echo "rebuild_kernel=true → 删除旧的同hash kernel bundle,用本轮重编的好bundle覆盖"
              fi
              gh release delete "${RELEASE_TAG}" --repo ${{ github.repository }} --yes --cleanup-tag 2>/dev/null || true
              sleep 3
            else
              echo "杂凑${KERNEL_HASH}的kernel bundle已存在且本轮未重编kernel，无需重复上传"
              exit 0
            fi
          fi
          KSTATE="${{ github.workspace }}/kstate.tar.zst"
          STAMP_PATHS=""
          INSTALL_PATHS=""
          for p in $KERNEL_PKGS; do
            STAMP_PATHS="$STAMP_PATHS .stamps/${p}"
            for d in "${BD}install_pkg/${p}-"*; do [ -d "$d" ] && INSTALL_PATHS="$INSTALL_PATHS install_pkg/$(basename "$d")"; done
          done
          tar -I 'zstd -T0 -3' -cf "${KSTATE}" -C "${BD}" ${STAMP_PATHS} ${INSTALL_PATHS}
          zstd -t "${KSTATE}" || { echo "kernel bundle自检损坏，不上传"; rm -f "${KSTATE}"; exit 1; }
          ls -lh "${KSTATE}"
          gh release create "${RELEASE_TAG}" --repo ${{ github.repository }} --prerelease \
            --title "Kernel Bundle(自动，${{ matrix.model }}，hash ${KERNEL_HASH})" \
            --notes "linux内核+耦合驱动模组(gpu-aml/media_modules-aml/wifi-bt等)的原子化快取，按package.mk+patches内容杂凑(${KERNEL_HASH})锁版本。杂凑不变代表这些包源码未变，可直接复用，永不单独重编其中一部分。" \
            "${KSTATE}"
          rm -f "${KSTATE}"
          echo "kernel bundle已快取(hash=${KERNEL_HASH})"

      - name: Save build checkpoint to Release (always)
        if: always()
        # NOTE(w2xg2022): 存checkpoint失败(空间不足等)不该挡掉后面的韧体上传。
        # continue-on-error让Save失败时job仍算成功、继续跑Collect/Upload firmware，
        # 确保build成功产出的.img一定会被上传。
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          BUILD_DIR=$(ls -d build.*/ 2>/dev/null | head -1)
          if [ -z "$BUILD_DIR" ]; then
            echo "找不到建置资料夹，跳过存档"
            exit 0
          fi
          # NOTE(w2xg2022): 前两轮存档都产出残缺的~47MB档，真凶是把11GB打包写到
          # /tmp(在runner的小分区)，写到47MB就把小分区塞爆、tar失败，但原本结尾
          # 接了「| tail」让管线结束码变成tail的(永远成功)，把tar的失败整个盖掉、
          # 误报success。改成：(1)写到大容量分区(workspace，跟52GB建置目录同一颗)；
          # (2)set -o pipefail + 明确检查tar结束码，tar真的失败就让步骤报错，不再
          # 上传残档污染下一轮。
          STATE_FILE="${{ github.workspace }}/state.tar.zst"
          # 打包前清掉build/(各套件编译暂存工作目录，很肥)以腾出空间；但保留glibc/icu
          # 的build目录——它们在后面套件的安装阶段还会被引用(glibc:ES取charmaps/localedef;
          # icu:--with-cross-build)，剥掉会让还原后的组装失败。保留这两个后，把它们也
          # 一并打包进checkpoint，下一轮还原就直接有、不用重编。
          echo "清理build/暂存工作目录(保留glibc/icu+initramfs相关包)以腾出空间..."
          # NOTE(w2xg2022): linux不再特殊保留——kernel bundle(独立的Save步骤)只快取
          # .stamps+install_pkg，不需要build/linux-*，可以跟一般套件一样清掉腾空间。
          # NOTE(w2xg2022): ★initramfs相关包的build/必须保留★——make image的initramfs
          # 「(init)安装」pass从$PKG_BUILD(build/)复制文件(busybox/gcc-libgcc/util-linux等
          # 的makeinstall_init),不是读install_pkg。build/被裁→initramfs打包成空(195B
          # ramdisk)→固件SYSTEM正常但无initramfs、卡开机。这几个=有(init)安装的包。
          if [ -d "${BUILD_DIR}build" ]; then
            find "${BUILD_DIR}build" -mindepth 1 -maxdepth 1 -type d \
              ! -name 'glibc-*' ! -name 'icu-*' \
              ! -name 'busybox-*' ! -name 'gcc-*' ! -name 'util-linux-*' \
              ! -name 'e2fsprogs-*' ! -name 'dosfstools-*' ! -name 'splash-image-*' \
              ! -name 'terminus-font-*' ! -name 'bkeymaps-*' ! -name 'initramfs-*' \
              -exec rm -rf {} + 2>/dev/null || true
          fi
          # 收集要保留的build目录(glibc/icu + initramfs相关包，可能不存在，用glob展开)
          KEEP_BUILD=$(ls -d "${BUILD_DIR}build/glibc-"* "${BUILD_DIR}build/icu-"* \
            "${BUILD_DIR}build/busybox-"* "${BUILD_DIR}build/gcc-"* "${BUILD_DIR}build/util-linux-"* \
            "${BUILD_DIR}build/e2fsprogs-"* "${BUILD_DIR}build/dosfstools-"* "${BUILD_DIR}build/splash-image-"* \
            "${BUILD_DIR}build/terminus-font-"* "${BUILD_DIR}build/bkeymaps-"* "${BUILD_DIR}build/initramfs-"* 2>/dev/null)
          # ★2026-07-12 根治花屏(真根因)★:必须一起保存 install_init/(initramfs 各包的 init 装配
          # 产物)。之前只存 .stamps 不存 install_init → 还原后 build_init 标记在=以为装好而跳过,
          # 但 install_init/<pkg>/ 内容没了 → initramfs 缺 glibc(libc.so.6)等 → 花屏。install_init
          # 不大(就是 initramfs 内容),存它最省事、最稳。
          KEEP_INIT=$(ls -d "${BUILD_DIR}install_init" 2>/dev/null)
          echo "打包接力状态(工具链+已装套件+进度标记+glibc/icu build+install_init)到大容量分区..."
          df -h "${{ github.workspace }}"
          if ! tar -I 'zstd -T0 -3' -cf "${STATE_FILE}" \
               "${BUILD_DIR}toolchain" "${BUILD_DIR}install_pkg" "${BUILD_DIR}.stamps" ${KEEP_INIT} ${KEEP_BUILD}; then
            echo "打包失败(多半是空间不足)，不上传残档"
            rm -f "${STATE_FILE}"
            exit 1
          fi
          ls -lh "${STATE_FILE}"
          echo "本地二次验证完整性..."
          zstd -t "${STATE_FILE}" || { echo "打包出来的档自检就损坏，不上传"; rm -f "${STATE_FILE}"; exit 1; }
          # NOTE(w2xg2022): GitHub单一Release asset硬上限2GiB，实测2.5GB整包上传
          # 直接HTTP 422 Validation Failed。且接力状态会随建置进度越来越大，只会
          # 更超标。改成切成1900MiB(安全低于2GiB)的多块(state.tar.zst.partNN)分别
          # 上传，还原时再照顺序cat拼回。上传前先删掉Release上所有旧的state分块，
          # 避免上一轮残留的多余分块(例如上轮3块这轮2块，第3块没被覆盖)污染拼接。
          rm -f "${STATE_FILE}".part*
          split -b 1900M -d -a 2 "${STATE_FILE}" "${STATE_FILE}.part"
          rm -f "${STATE_FILE}"
          ls -lh "${{ github.workspace }}"/state.tar.zst.part*
          RELEASE_TAG="build-state-${{ matrix.model }}"
          gh release view "${RELEASE_TAG}" --repo ${{ github.repository }} >/dev/null 2>&1 || \
            gh release create "${RELEASE_TAG}" --repo ${{ github.repository }} --prerelease \
              --title "建置接力状态(自动，${{ matrix.model }})" \
              --notes "自动保存的建置中间状态(切块)，供下一轮云编译接续使用，不是可安装的韧体。"
          for a in $(gh release view "${RELEASE_TAG}" --repo ${{ github.repository }} --json assets -q '.assets[].name' 2>/dev/null); do
            case "$a" in state.tar.zst*) echo "删除旧分块 $a"; gh release delete-asset "${RELEASE_TAG}" "$a" --repo ${{ github.repository }} --yes || true;; esac
          done
          for p in "${{ github.workspace }}"/state.tar.zst.part*; do
            echo "上传 $(basename "$p") ..."
            gh release upload "${RELEASE_TAG}" "$p" --repo ${{ github.repository }} --clobber
          done

      - name: Fail job if build did not actually succeed
        if: steps.build_step.outcome != 'success'
        run: |
          echo "本轮建置未完整跑完(逾时自停或真的失败)，接力状态已存档，等下一轮继续。"
          exit 1

      - name: Collect artifacts
        id: collect
        run: |
          mkdir -p out
          find . -maxdepth 3 -type d -name "target" -exec sh -c 'cp -v "$1"/*.img.gz out/ 2>/dev/null; cp -v "$1"/*.img.xz out/ 2>/dev/null; cp -v "$1"/*.tar out/ 2>/dev/null' _ {} \;
          find . -maxdepth 6 -iname "*${{ env.DISTRO }}*${{ matrix.model }}*" \( -iname "*.img.gz" -o -iname "*.img.xz" -o -iname "*.tar" \) -exec cp -v {} out/ \; 2>/dev/null || true
          ls -la out/ || echo "no artifacts found, check build log"

      - name: Upload build log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.model }}
          path: build-${{ matrix.model }}.log
          retention-days: 14

      - name: Upload firmware artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: EmuELEC-${{ matrix.model }}
          path: out/*
          if-no-files-found: warn

      # NOTE(w2xg2022): 改用 gh CLI + 重试,取代 softprops/action-gh-release@v2。
      # 2026-07-17 坐实:run 29537291663 的 Build/Collect/Upload artifact 全部成功,
      # 整整 1h42m 的编译成果只因这一步撞上 GitHub 自己的 500(回传 "Unicorn! · GitHub"
      # 错误网页,而非 API JSON)就全部报废。这类 5xx 是 GitHub 端的暂时性故障,重试即可,
      # 绝不该让一轮云编译白跑。顺带避开该 action 把 tag 解析成 refs/heads/main 的怪象。
      - name: Create release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ matrix.model }}-${{ github.run_id }}
        run: |
          NOTES="自动云编译：${PROJECT}/${DEVICE} SUBDEVICE=${{ matrix.model }}
          触发方式：${{ github.event_name }}"
          for i in 1 2 3 4 5; do
            if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
              gh release upload "$TAG" out/* --repo "${{ github.repository }}" --clobber && exit 0
            else
              gh release create "$TAG" out/* --repo "${{ github.repository }}" \
                --title "EmuELEC ${{ matrix.model }} (${{ github.run_id }})" \
                --notes "$NOTES" --latest && exit 0
            fi
            echo "::warning::建立 Release 第 ${i} 次失败(多半是 GitHub 5xx),$((i*20))s 后重试"
            sleep $((i*20))
          done
          echo "::error::建立 Release 重试 5 次仍失败"
          exit 1

      # NOTE(w2xg2022): 只有真的完整编出韧体(success)才记录本次commit到built-commit
      # 这个Release的body，供下次schedule触发时的gate比对「代码有没有变」。
      - name: Record built commit
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view built-commit --repo ${{ github.repository }} >/dev/null 2>&1; then
            gh release edit built-commit --repo ${{ github.repository }} --notes "${{ github.sha }}"
          else
            gh release create built-commit --repo ${{ github.repository }} --prerelease \
              --title "上次成功建置的commit(月度cron的gate用)" --notes "${{ github.sha }}"
          fi
          echo "已记录本次成功建置的commit：${{ github.sha }}"
